<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>구간 태깅 내비게이션 프로토타입</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>구간 태깅 내비게이션 프로토타입</h1>
        <p>
          기본 경로: <strong>신사역 → 고속터미널역</strong> · 경로 더블클릭으로 구간 개인화 모드 진입
        </p>
      </header>

      <section class="iphone16-frame" aria-label="iPhone 16 ratio frame">
        <div class="screen">
          <div class="top-ui">
            <div class="search-row">
              <input id="startInput" type="text" value="신사역" aria-label="출발지" />
              <button id="swapBtn" class="icon-btn" title="출발/도착 바꾸기">⇅</button>
            </div>
            <div class="search-row">
              <input id="endInput" type="text" value="고속터미널역" aria-label="도착지" />
              <button id="searchRouteBtn" class="icon-btn" title="경로 검색">🔍</button>
            </div>
            <div id="searchResults" class="search-results" hidden></div>
          </div>

          <div id="map" aria-label="지도"></div>

          <div class="status-panel">
            <div>
              <strong id="routeTitle">신사역 → 고속터미널역</strong>
              <p id="routeSummary">경로 계산 중...</p>
            </div>
            <button id="enterTagModeBtn" class="primary-btn">태깅 모드</button>
          </div>

          <div id="tagInstruction" class="tag-instruction" hidden>
            <strong>태깅 모드</strong>
            <span>경로 위를 터치해서 시작/끝 깃발 2개를 선택하세요.</span>
          </div>
        </div>
      </section>

      <aside id="agentSheet" class="agent-sheet" aria-live="polite" hidden>
        <div class="drag-handle"></div>
        <h2>AI 에이전트 태깅</h2>
        <p id="selectedInfo">선택 구간 정보 계산 중...</p>

        <label for="contextInput">음성/텍스트 맥락 입력</label>
        <div class="context-row">
          <input id="contextInput" type="text" placeholder="예: 퇴근시간엔 이 구간 막히면 피하고 싶어" />
          <button id="voiceBtn" class="icon-btn" title="음성 입력">🎤</button>
        </div>

        <button id="analyzeBtn" class="secondary-btn">AI 해석하기</button>
        <div id="analysisResult" class="analysis-result">해석 전</div>

        <div class="confirm-box">
          <p>태깅 완료하시겠습니까?</p>
          <div class="btn-group">
            <button id="confirmYes" class="primary-btn">Y</button>
            <button id="confirmNo" class="ghost-btn">N</button>
          </div>
        </div>

        <div id="rerouteBox" class="confirm-box" hidden>
          <p>해당 태깅을 반영하여 경로를 재설정할까요?</p>
          <div class="btn-group">
            <button id="rerouteYes" class="primary-btn">Y</button>
            <button id="rerouteNo" class="ghost-btn">N</button>
          </div>
        </div>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
